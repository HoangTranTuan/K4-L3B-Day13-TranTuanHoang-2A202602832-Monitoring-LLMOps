service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >
    Dựa trên baseline thực tế, latency trung bình của hệ thống dao động trong khoảng 100-300ms.
    SLO mục tiêu là 99.5% tổng số request nhận vào (request_received) phải được phản hồi thành công
    (response_sent) với độ trễ latency_ms <= 3000ms trong chu kỳ cửa sổ trượt 28 ngày (28d).
    Tương ứng với mức SLO 99.5%, ngân sách lỗi (Error Budget) cho phép là 0.5%.
    Quy đổi ra số lượng request: Nếu hệ thống tiếp nhận 10,000 requests trong cửa sổ 28 ngày,
    error budget tối đa là 50 requests (10,000 * 0.5% = 50 requests) được phép bị lỗi (request_failed)
    hoặc phản hồi chậm hơn 3000ms. Nếu số request không đạt vượt quá 50, error budget sẽ cạn kiệt,
    đội ngũ vận hành sẽ kích hoạt chính sách đóng băng phát hành tính năng mới để ưu tiên khắc phục độ tin cậy.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
